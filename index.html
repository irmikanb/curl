error_callback:e=>{const p=GP;GP=null;if(p)p.rej(new Error((e&&e.type)||'popup'))}});return GC}
/* Вызывать сразу из нажатия кнопки, иначе браузер заблокирует окно входа Google */
function gauth(){if(tokOk())return Promise.resolve(GT.tok);if(!GCID)return Promise.reject(new Error('noid'));
if(!(window.google&&google.accounts&&google.accounts.oauth2)){gload().catch(()=>{});return Promise.reject(new Error('notready'))}
return new Promise((res,rej)=>{GP={res,rej};gcl().requestAccessToken({prompt:''})})}
async function gapi(url,o){const t=await gauth();o=o||{};o.headers=Object.assign({Authorization:'Bearer '+t},o.headers||{});
const r=await fetch(url,o);if(r.status==401){GT=null;throw new Error('auth')}if(!r.ok)throw new Error('http'+r.status);return r}
async function rmeta(){const q=encodeURIComponent("name='"+GFN+"' and trashed=false"),
r=await gapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+q+'&orderBy='+encodeURIComponent('modifiedTime desc')+'&fields='+encodeURIComponent('files(id,modifiedTime)'));
const j=await r.json();return (j.files||[])[0]||null}
async function rput(id,body){const bd='kdz'+uid()+uid(),meta=id?{}:{name:GFN,parents:['appDataFolder']},
data='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+body+'\r\n--'+bd+'--',
r=await gapi('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart&fields=id,modifiedTime',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:data});
return r.json()}
async function rget(id){const r=await gapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');return r.text()}

/* Сохранить на Диск. force=true перезаписывает чужую версию без вопросов */
async function upl(force){if(gbusy)return {busy:1};gbusy=true;
try{const m=await rmeta();
if(m&&!force&&m.modifiedTime!=DS.rm){DS.conflict=1;dsave();dsUi();return {c:1,m}}
const v0=DS.v||0,j=await rput(m&&m.id,JSON.stringify(D));
DS.rm=j.modifiedTime;DS.last=Date.now();DS.conflict=0;if((DS.v||0)==v0)DS.dirty=0;dsave();dsUi();gck=true;return {ok:1}}
finally{gbusy=false}}
function auto(){if(!DS.on||DS.conflict||gbusy||!tokOk())return;
upl(false).then(r=>{if(r&&r.c)toast('На Диске другая версия базы. Откройте «Сохранение базы» и выберите, какую оставить.')}).catch(()=>{})}

function derr(e){const m=String(e&&e.message||e);
toast(/noid/.test(m)?'Подключение к Диску ещё не настроено.':
/notready/.test(m)?'Связь с Google ещё загружается. Нажмите ещё раз через секунду.':
/popup_blocked|popup_failed/.test(m)?'Браузер заблокировал окно входа в Google. Разрешите всплывающие окна и повторите.':
/popup_closed|access_denied|user/.test(m)?'Вход в Google не выполнен.':
/auth|http401|http403/.test(m)?'Нет доступа к Диску. Нажмите кнопку ещё раз и войдите в Google заново.':
/bad/.test(m)?'Файл на Диске не подходит.':
/Failed to fetch|NetworkError|Load failed/.test(m)?'Нет связи с интернетом или с Google.':
'Не удалось связаться с Диском ('+m+').')}

function dlg(t,p,bs){DK=bs.map(b=>b[1]);
$('#dg').innerHTML=`<h2>${E(t)}</h2><p style="margin:12px 0 0">${E(p)}</p><div class="bar" style="flex-wrap:wrap">${bs.map((b,i)=>`<button class="btn ${b[2]||''}" onclick="dk(${i})">${E(b[0])}</button>`).join('')}</div>`;
if(!$('#dg').open)$('#dg').showModal()}
function dk(i){const f=DK[i];$('#dg').close();if(f)f()}

function dConf(m){dlg('На Диске другая версия','На Диске есть база, сохранённая '+fdt(m.modifiedTime)+'. На этом устройстве данные менялись отдельно. Выберите, какую версию оставить: вторая будет заменена.',
[['Загрузить с Диска',()=>dPull(true)],['Перезаписать Диск этой версией',dPushF,'l'],['Отмена',null,'l']])}
function dPush(){gauth().then(()=>upl(false)).then(r=>{if(r&&r.c)dConf(r.m);else if(r&&r.ok){toast('Сохранено на Диск');rfs()}}).catch(derr)}
function dPushF(){gauth().then(()=>upl(true)).then(()=>{toast('Сохранено на Диск');rfs()}).catch(derr)}
function dPull(force){if(gbusy)return;
gauth().then(async()=>{const m=await rmeta();
if(!m){toast('На Диске пока нет сохранённой базы');return}
if(!force&&DS.dirty){dlg('Есть несохранённые изменения','На этом устройстве есть изменения, которых нет на Диске. Если загрузить версию с Диска, они пропадут.',[['Загрузить с Диска',()=>dPull(true)],['Отмена',null,'l']]);return}
gbusy=true;let t;try{t=await rget(m.id)}finally{gbusy=false}
let d;try{d=JSON.parse(t)}catch(e){throw new Error('bad')}
if(!d||!d.cats||!d.prods)throw new Error('bad');
SQ=1;try{applyData(d)}finally{SQ=0}
DS.rm=m.modifiedTime;DS.dirty=0;DS.conflict=0;DS.last=Date.now();dsave();dsUi();gck=true;
toast('База загружена с Диска');go('home')}).catch(derr)}
function dConn(){gauth().then(async()=>{const m=await rmeta();DS={on:1,conflict:1};dsave();
if(!m){await upl(true);toast('Google Диск подключён, база сохранена на Диск');rfs();return}
dlg('На Диске уже есть база','На Диске найдена база от '+fdt(m.modifiedTime)+'. Если это другое устройство, загрузите её сюда. Если главная база здесь, перезапишите Диск.',
[['Загрузить с Диска',()=>dPull(true)],['Перезаписать Диск этой базой',dPushF,'l'],['Отмена',()=>{DS={};dsave();dsUi();rfs()},'l']])}).catch(derr)}
function dCheck(){gauth().then(async()=>{const m=await rmeta();gck=true;
if(!m){await upl(true);toast('Сохранено на Диск');rfs();return}
if(m.modifiedTime==DS.rm){DS.conflict=0;dsave();if(DS.dirty){await upl(false);toast('Сохранено на Диск')}else toast('На Диске та же версия, обновлений нет');rfs();return}
if(DS.dirty||DS.conflict){DS.conflict=1;dsave();dsUi();dConf(m);return}
dlg('На Диске более новая версия','База на Диске сохранена '+fdt(m.modifiedTime)+'. Загрузить её на это устройство?',[['Загрузить с Диска',()=>dPull(true)],['Не сейчас',null,'l']])}).catch(derr)}
function dDisc(){dlg('Отключить Google Диск?','Копия на Диске останется. На этом устройстве автосохранение остановится.',[['Отключить',()=>{try{if(GT&&window.google)google.accounts.oauth2.revoke(GT.tok,()=>{})}catch(e){}GT=null;DS={};dsave();dsUi();toast('Диск отключён');rfs()}],['Отмена',null,'l']])}

function drCard(h){if(!GCID||!DS.on)return '';
if(DS.conflict)return `<div class="card bk"><b>На Диске другая версия базы</b><p class="mut" style="margin:6px 0 14px">Версия на Диске и версия на этом устройстве расходятся. Выберите, какую оставить.</p><button class="btn" onclick="dCheck()">Разобраться</button></div>`;
if(DS.dirty)return `<div class="card bk"><b>Изменения ещё не сохранены на Диск</b><p class="mut" style="margin:6px 0 14px">Автосохранение работает, пока вход в Google свежий (около часа). Нажмите кнопку, чтобы сохранить сейчас.</p><button class="btn" onclick="dPush()">Сохранить на Диск</button></div>`;
if(h&&!tokOk()&&!gck)return `<p style="margin:0 0 18px"><a class="ln" tabindex="0" role="button" onclick="dCheck()" onkeydown="if(event.key=='Enter')dCheck()">☁ Проверить, нет ли на Диске более свежей версии</a></p>`;
return ''}
function dCard(){const st='class="card" style="max-width:560px;margin-top:18px"';
if(!GCID)return `<div ${st}><h2>Google Диск</h2><p class="mut" style="margin:8px 0 0">Подключение к Диску ещё не настроено.</p></div>`;
if(!DS.on)return `<div ${st}><div class="eyebrow">Рекомендуется</div><h2 style="margin:4px 0 10px">Автосохранение в Google Диск</h2><p class="mut">Подключите один раз, и клиенты, визиты и памятки будут сами сохраняться в вашем Google Диске. Если сменится телефон или очистится браузер, всё вернётся одной кнопкой. Файл лежит в скрытой папке: его не видно и случайно не удалить. Другие файлы на Диске приложение не видит.</p><button class="btn" onclick="dConn()">Подключить Google Диск</button></div>`;
return `<div ${st}><div class="eyebrow">Автосохранение</div><h2 style="margin:4px 0 10px">Google Диск подключён</h2><p style="margin:8px 0 0">Состояние: <b>${DS.conflict?'версии расходятся':DS.dirty?'есть изменения, не сохранённые на Диск':'всё сохранено на Диск'}</b></p><p class="mut sm">Последнее сохранение или загрузка: ${DS.last?fdt(DS.last):'—'}. Автосохранение работает, пока вход в Google свежий (около часа), потом нажмите «Сохранить на Диск». На новом устройстве: «Подключить Google Диск» → «Загрузить с Диска».</p>
<div class="row"><button class="btn" onclick="dPush()">Сохранить на Диск</button><button class="btn l" onclick="dPull()">Загрузить с Диска</button></div>
<p style="margin:14px 0 0"><a class="ln" tabindex="0" role="button" onclick="dDisc()" onkeydown="if(event.key=='Enter')dDisc()">Отключить Диск</a></p></div>`}
if(GCID&&DS.on)gload().catch(()=>{});dsUi();

go('home');nac();
</script></body></html>
