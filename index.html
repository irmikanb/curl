.pl.bk{background:var(--bk);border-color:var(--bd);box-shadow:none}.pl.bk:hover{border-color:var(--mut)}.pl.bk:active{background:#E2D9C8}
.pq{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pq .btn{padding:7px 12px;min-height:36px;font-size:13px}
.pq a{font-size:13px;color:var(--mut);cursor:pointer;padding:6px 4px}

<script>

const $=s=>document.querySelector(s),

 ['НЕСМЫВАЕМЫЙ УХОД','Дополнительное увлажнение, защита и облегчение расчёсывания.','Нанести небольшое количество на влажные или сухие волосы по длине.','После мытья или в течение дня.'],
 ['ТЕРМОЗАЩИТА','Защита волос от высоких температур при укладке.','Нанести на сухие или слегка влажные волосы перед горячей укладкой.','Перед каждой горячей укладкой.']
 ].map((c,i)=>({id:'c'+i,name:c[0],o:i+1,why:c[1],how:c[2],when:c[3]}))});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||seed();D.memos=D.memos||[];D.meta=D.meta||{};D.clients=D.clients||[];D.visits=D.visits||[];if(!D.meta.installedAt)D.meta.installedAt=Date.now();
let M=nm(),qr='',cur=null,curImg='',DR=[],CC=null,V=null;

const sorted=()=>D.cats.filter(c=>!c.arch).sort((a,b)=>a.o-b.o),
cn=id=>(D.cats.find(c=>c.id==id)||{}).name||'',
img=p=>p.img?`<img src="${p.img}" alt="">`:'<span class="ph"></span>',

/* Клиенты: связь памяток с клиентами по имени */
function cby(n){n=(n||'').trim().toLowerCase();return n?D.clients.find(c=>c.name.trim().toLowerCase()==n):null}
function lk(m){const n=(m.name||'').trim();if(!n){delete m.cid;return}let c=cby(n);if(!c){c={id:uid(),name:n,phone:'',ig:'',note:'',upd:Date.now()};D.clients.push(c)}m.cid=c.id}

function migV(){let ch=0;D.visits.forEach(v=>{if(!v.svcs){v.svcs=v.svc?[v.svc]:[];v.f=v.svc?{[v.svc]:v.f||{}}:{};delete v.svc;ch=1}});if(ch)save()}
mig();migV();
const MASTER={n:'Кудрявый мастер Надежда Киреева',p:'+375298745111',i:'nadia_kireeva_'};
function linkMV(){let ch=0;D.memos.forEach(m=>{if(m.vid&&D.visits.some(v=>v.id==m.vid))return;if(m.vid){delete m.vid;ch=1}if(!m.cid)return;
 const v=D.visits.find(v=>v.cid==m.cid&&v.date==m.date&&!D.memos.some(x=>x.vid==v.id));if(v){m.vid=v.id;ch=1}});if(ch)save()}
linkMV();

function go(v){
 if(v=='client'&&!D.clients.some(c=>c.id==CC))v='clients';
  if(v=='cats')DR=DR||[];
 $('main').innerHTML={home:vHome,memo:vMemo,prods:vProds,cats:vCats,set:vSet,pdf:vPdf,clients:vClients,client:vClient}[v]();
 if(v=='prods')lp();if(v=='clients')lc();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==(v=='pdf'||v=='memo'||v=='client'?'clients':v)));
 scrollTo(0,0)}

/* Главная и база памяток */
function memoRow(m,back){return `<div class="mr"><div><b>${E(m.name)||'Без имени'}</b><br><span class="mut sm">${fd(m.date)}</span></div><div class="mb"><button class="btn l" onclick="om('${m.id}','pdf')">Открыть</button><button class="btn l" onclick="om('${m.id}','memo')">Изменить</button><button class="btn l" onclick="xm('${m.id}','${back||'home'}')">Удалить</button></div></div>`}

function vHome(){const rv=[...D.visits].filter(v=>D.clients.some(c=>c.id==v.cid)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
return `${needsBackup()?bkBanner():''}<h1>Кабинет кудрявого мастера</h1>
<div class="hm"><button class="hc dk" onclick="go('clients')"><b>КЛИЕНТЫ</b><span>Карточки клиентов, журнал визитов и памятки</span></button><button class="hc" onclick="go('prods')"><b>БАЗА СРЕДСТВ</b><span>Добавить и отредактировать продукты</span></button></div>
<div class="top" style="margin-top:40px"><h2>Последние визиты</h2><a onclick="go('clients')" style="cursor:pointer;color:var(--acc)">Все клиенты →</a></div>
<div class="plist">${rv.map(v=>{const c=D.clients.find(x=>x.id==v.cid);return `<button class="pl" onclick="oc('${c.id}')"><span><b>${E(c.name)}</b><br><span class="mut sm">${fd(v.date)} · ${E(v.svcs.join(', '))}${D.memos.some(m=>m.vid==v.id)?' · есть памятка':''}</span></span><span class="chev" aria-hidden="true">›</span></button>`}).join('')||`<p class="mut" style="margin:0">Пока нет визитов. Откройте клиента в разделе «Клиенты» и добавьте первый визит.</p>`}</div>`}

function nph(v){let d=String(v||'').replace(/\D/g,'');if(!d)return '';
 if(d.length==11&&d.startsWith('80'))d='375'+d.slice(2);else if(d.length==9)d='375'+d;

function cts(c){const p=nph(c.phone),i=nig(c.ig),t=ntl(c.tl),a=[];
 if(p)a.push(`<a class="ct" href="tel:${p}" title="Позвонить" aria-label="Позвонить">${IP}<span class="ln">${E(fph(p))}</span></a>`);

 if(t)a.push(`<a class="ct" href="https://t.me/${encodeURIComponent(t)}" target="_blank" rel="noopener" title="Telegram" aria-label="Telegram">${IT}<span class="ln">@${E(t)}</span></a>`);
 if(i)a.push(`<a class="ct" href="https://instagram.com/${encodeURIComponent(i)}" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram">${IG}<span class="ln">@${E(i)}</span></a>`);

function pm(e){let d=e.value.replace(/\D/g,'');

<div class="bar"><button class="btn l" onclick="${delFn}('${dom}')">Удалить</button><button class="btn" onclick="${saveFn}('${dom}')">Сохранить</button></div></div>`}

function sD(tid){const idx=DR.findIndex(c=>c.tid==tid);if(idx<0)return;const v=rdVals(tid);if(!v.name.trim())return toast('Введите название категории перед сохранением');D.cats.push({id:uid(),name:v.name,o:v.o,why:v.why,how:v.how,when:v.when});DR.splice(idx,1);save();go('cats');toast('Категория добавлена')}
function rD(tid){DR=DR.filter(c=>c.tid!=tid);go('cats')}
function xC(id){const used=D.prods.filter(p=>p.cat==id&&D.memos.some(m=>m.sel[p.id]));
ask('Удалить категорию вместе со средствами из неё?'+(used.length?' В уже сделанных памятках они останутся.':''),()=>{
D.prods=D.prods.filter(p=>p.cat!=id||used.includes(p));used.forEach(p=>p.arch=true);

async function ex(){const nm='hair-care-backup-'+new Date().toLocaleDateString('en-CA')+'.json',blob=new Blob([JSON.stringify(D)],{type:'application/json'});
 if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:nm,types:[{description:'Резервная копия',accept:{'application/json':['.json']}}]}),w=await h.createWritable();await w.write(blob);await w.close();D.meta.lastBackup=Date.now();save();return toast('Копия сохранена')}catch(e){if(e&&e.name=='AbortError')return}}

K1='#24201d',AC='#776B5D',MU='#5c5148',BG='#F3EEEA',LN='#DCD3C6';
let PB=null;
const fn=()=>('Памятка по уходу за волосами '+M.name).trim().replace(/[\\/:*?"<>|]/g,'')+'.pdf',

async function build(){
 const s=D.set,cs=allCats().filter(c=>D.prods.some(p=>p.cat==c.id&&M.sel[p.id])),IM={},cv=[];
 try{await Promise.all([document.fonts.load('500 40px "Cormorant Garamond"'),document.fonts.load('400 24px Manrope'),document.fonts.load('700 24px Manrope')])}catch(e){}
 for(const p of D.prods)if(M.sel[p.id])IM[p.id]=await loadImg(p.img);
 const qi=await loadImg(MASTER.qr);let c,x,y;
 const np=()=>{c=document.createElement('canvas');c.width=PW;c.height=PH;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);x.textBaseline='top';cv.push(c);y=MT},
 need=h=>{if(y+h>PH-MB)np()},
 wrap=(t,w,f)=>{x.font=f;const o=[];String(t||'').split('\n').forEach(q=>{let l='';q.split(' ').forEach(wd=>{const t2=l?l+' '+wd:wd;if(x.measureText(t2).width>w&&l){o.push(l);l=wd}else l=t2});o.push(l)});return o},
 txt=(t,X,w,f,col,lh)=>wrap(t,w,f).forEach(l=>{need(lh);x.font=f;x.fillStyle=col;x.fillText(l,X,y);y+=lh}),
 line=()=>{x.fillStyle=LN;x.fillRect(MX,y,CW,2);y+=2},
 rr=(X,Y,W,H,R)=>{x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()},
 TW=(CW-16)/2,TH=84,
 tlay=p=>{const w=TW-TH-40,sg=[[p.name,'700 22px '+SA,K1,28]];
  if(p.where)sg.push(['Где купить: '+p.where,'400 19px '+SA,MU,25]);
  if(p.art)sg.push(['Артикул: '+p.art,'400 19px '+SA,MU,25]);
  if(p.com)sg.push([p.com,'400 19px '+SA,K1,25]);
  const L=sg.map(g=>wrap(g[0],w,g[1])),th=sg.reduce((a,g,i)=>a+L[i].length*g[3],0);
  return{p,sg,L,h:Math.max(TH,th)+28}},
 tdraw=(t,X,Y,H)=>{rr(X,Y,TW,H,10);x.fillStyle='#fff';x.fill();x.strokeStyle='#B0A695';x.lineWidth=1.5;x.stroke();
  x.fillStyle='#fff';x.fillRect(X+14,Y+14,TH,TH);x.strokeStyle=LN;x.lineWidth=2;x.strokeRect(X+14,Y+14,TH,TH);
  const im=IM[t.p.id];if(im){const r=Math.min((TH-12)/im.width,(TH-12)/im.height),w=im.width*r,h2=im.height*r;x.drawImage(im,X+14+(TH-w)/2,Y+14+(TH-h2)/2,w,h2)}
  let yy=Y+14;t.sg.forEach((g,i)=>{x.font=g[1];x.fillStyle=g[2];t.L[i].forEach(l=>{x.fillText(l,X+14+TH+14,yy);yy+=g[3]})})},
 P=t=>{t=String(t||'').trim();return t&&!/[.!?…]$/.test(t)?t+'.':t};
 np();
 x.font='700 17px '+SA;x.fillStyle=MU;x.fillText('ПЕРСОНАЛЬНАЯ ПАМЯТКА',MX,y);y+=34;
 txt('Уход за волосами',MX,CW,'500 44px '+SE,K1,52);y+=6;
 txt((M.name||'—')+' · '+fd(M.date),MX,CW,'500 24px '+SA,MU,32);y+=14;
 if(M.note){const L=wrap(M.note,CW-56,'400 22px '+SA),h=L.length*32+36;need(h);x.fillStyle=BG;x.fillRect(MX,y,CW,h);x.fillStyle=AC;x.fillRect(MX,y,5,h);x.font='400 22px '+SA;x.fillStyle=K1;L.forEach((l,i)=>x.fillText(l,MX+28,y+18+i*32));y+=h+10}
 if(!cs.length){y+=20;txt('Средства не выбраны.',MX,CW,'400 22px '+SA,MU,32)}
 cs.forEach((cat,i)=>{
  const ts=D.prods.filter(p=>p.cat==cat.id&&M.sel[p.id]).map(tlay),
   dl=wrap([cat.why,cat.how,cat.when].filter(Boolean).map(P).join(' '),CW,'400 20px '+SA),
   h0=Math.max(0,...ts.slice(0,2).map(t=>t.h));
  need(36+12+dl.length*28+10+h0+12);if(y>MT)y+=24;
  x.font='400 24px '+SA;x.fillStyle=MU;x.fillText(String(i+1).padStart(2,'0'),MX,y);x.font='700 24px '+SA;x.fillStyle=K1;x.fillText(cat.name,MX+52,y);y+=36;
  x.fillStyle=LN;x.fillRect(MX,y,CW,2);y+=12;
  dl.forEach(l=>{x.font='400 20px '+SA;x.fillStyle=MU;x.fillText(l,MX,y);y+=28});y+=10;
  for(let k=0;k<ts.length;k+=2){const a=ts[k],b=ts[k+1],h=Math.max(a.h,b?b.h:0);need(h+12);tdraw(a,MX,y,h);if(b)tdraw(b,MX+TW+16,y,h);y+=h+12}
  if(M.cc[cat.id]){need(66);y+=4;x.font='700 15px '+SA;x.fillStyle=MU;x.fillText('КОММЕНТАРИЙ МАСТЕРА',MX,y);y+=24;txt(M.cc[cat.id],MX,CW,'400 21px '+SA,K1,30)}});
 if(M.rec){need(120);y+=26;x.fillStyle=LN;x.fillRect(MX,y,CW,2);y+=22;txt('Рекомендации мастера',MX,CW,'700 24px '+SA,K1,34);y+=6;txt(M.rec,MX,CW,'400 21px '+SA,K1,30)}
 const LK=cv.map(()=>[]),
 it=[[MASTER.n,''],[fph(MASTER.p),'tel:'+MASTER.p],['@'+MASTER.i,'https://instagram.com/'+MASTER.i]];
 cv.forEach((g,pi)=>{const t=g.getContext('2d');t.textBaseline='top';
  
  
  t.fillStyle=LN;t.fillRect(MX,PH-124,CW,2);
  let fx=MX,fy=PH-104;const mw=CW-(qi?120:0);t.font='500 22px '+SA;
  const its=[[(pi+1)+' / '+cv.length,''],...it];its.forEach(([tx,u],i)=>{const w=t.measureText(tx).width;if(fx>MX&&fx+w>MX+mw){fx=MX;fy+=34}
   t.fillStyle=u?AC:i?K1:MU;t.fillText(tx,fx,fy);
   if(u){t.fillRect(fx,fy+27,w,1.5);LK[pi].push({x:fx,y:fy-2,w,h:32,u})}
   fx+=w;if(i<its.length-1){t.fillStyle=MU;t.fillText('  ·  ',fx,fy);fx+=t.measureText('  ·  ').width}});
  if(qi){const r=Math.min(90/qi.width,90/qi.height);t.drawImage(qi,PW-MX-qi.width*r,PH-112,qi.width*r,qi.height*r)}});
 return{u:cv.map(g=>g.toDataURL('image/jpeg',.92)),k:LK}}
function pdf(u,k){const en=new TextEncoder(),P=[],O=[],N=u.length;let n=0;
 const put=d=>{const b=typeof d=='string'?en.encode(d):d;P.push(b);n+=b.length},
 ob=(i,...b)=>{O[i]=n;put(i+' 0 obj\n');b.forEach(put);put('\nendobj\n')};
 put('%PDF-1.4\n');
 ob(1,'<</Type/Catalog/Pages 2 0 R>>');
 ob(2,'<</Type/Pages/Count '+N+'/Kids['+u.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
 u.forEach((s,i)=>{const b=Uint8Array.from(atob(s.split(',')[1]),ch=>ch.charCodeAt(0)),p=3+3*i,ct='q 595.28 0 0 841.89 0 0 cm /I Do Q';
  ob(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</I '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R/Annots['+(k[i]||[]).map(a=>{const f=595.28/PW,e=encodeURI(a.u).replace(/[()\\]/g,'\\$&');return '<</Type/Annot/Subtype/Link/Border[0 0 0]/Rect['+[a.x*f,841.89-(a.y+a.h)*f,(a.x+a.w)*f,841.89-a.y*f].map(v=>v.toFixed(2)).join(' ')+']/A<</S/URI/URI('+e+')>>>>'}).join('')+']>>');
  ob(p+1,'<</Length '+ct.length+'>>\nstream\n'+ct+'\nendstream');
  ob(p+2,'<</Type/XObject/Subtype/Image/Width '+PW+'/Height '+PH+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+b.length+'>>\nstream\n',b,'\nendstream')});
 const x0=n,T=3*N+3;
 put('xref\n0 '+T+'\n0000000000 65535 f \n');
 for(let i=1;i<T;i++)put(String(O[i]).padStart(10,'0')+' 00000 n \n');
 put('trailer\n<</Size '+T+'/Root 1 0 R>>\nstartxref\n'+x0+'\n%%EOF');
 return new Blob(P,{type:'application/pdf'})}
async function mk(){let u,k;
 try{({u,k}=await build())}catch(e){console.error(e);return toast('Не удалось собрать PDF')}
 if(!$('#pp'))return;
 PB=pdf(u,k);
 $('#pp').innerHTML=u.map(s=>`<img src="${s}" alt="Страница памятки">`).join('');
 $('#pm').textContent='Готово. Проверьте памятку и сохраните PDF.';
 $('#bs').disabled=false;$('#bd').disabled=false}
function fdl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},5000)}
function dl(){fdl(PB,fn())}
function sh(){let f,ok=false;try{f=new File([PB],fn(),{type:'application/pdf'});ok=navigator.canShare&&navigator.canShare({files:[f]})}catch(e){}
 if(ok)navigator.share({files:[f]}).catch(()=>{});else{dl();toast('На этом устройстве «Поделиться» недоступно. PDF скачан, прикрепите его в мессенджере вручную.')}}
const nac=()=>document.querySelectorAll('input,textarea').forEach(e=>{if(e.getAttribute('autocomplete')!='off')e.setAttribute('autocomplete','off')});
new MutationObserver(nac).observe(document.body,{childList:true,subtree:true});
go('home');nac();
