 ].map((c,i)=>({id:'c'+i,name:c[0],o:i+1,why:c[1],how:c[2],when:c[3]}))});

function migV(){let ch=0;D.visits.forEach(v=>{if(!v.svcs){v.svcs=v.svc?[v.svc]:[];v.f=v.svc?{[v.svc]:v.f||{}}:{};delete v.svc;ch=1}});if(ch)save()}
mig();migV();
const MASTER={n:'Кудрявый мастер Надежда Киреева',p:'+375298745111',i:'nadia_kireeva_'};

 const v=D.visits.find(v=>v.cid==m.cid&&v.date==m.date&&!D.memos.some(x=>x.vid==v.id));if(v){m.vid=v.id;ch=1}});if(ch)save()}
linkMV();

 scrollTo(0,0)}

 if(d.length<=3&&'375'.startsWith(d))d='';else if(d.startsWith('375'))d=d.slice(3);else if(d.startsWith('80'))d=d.slice(2);
 d=d.slice(0,9);let r='+375';
 if(d.length)r+=' '+d.slice(0,2);if(d.length>2)r+=' '+d.slice(2,5);if(d.length>5)r+='-'+d.slice(5,7);if(d.length>7)r+='-'+d.slice(7,9);

const IV='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#7360F2"/><path d="M12 5.5c-3.6 0-6 2.1-6 5.3 0 1.7.7 3 1.9 3.9V18l2.3-1.3c.6.1 1.2.2 1.8.2 3.6 0 6-2.1 6-5.3s-2.4-5.3-6-5.3z" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9.5" cy="11" r="1" fill="#fff"/><circle cx="12" cy="11" r="1" fill="#fff"/><circle cx="14.5" cy="11" r="1" fill="#fff"/></svg>',
